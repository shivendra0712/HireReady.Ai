services:
  backend:
    image: shivendra0712/hireready-backend:v1
    ports:
      - "3000:3000"
    env_file:
      - ./Backend/.env
    restart: always

  frontend:
    image: shivendra0712/hireready-frontend:v1
    ports:
      - "5173:5173"
    env_file:
      - ./Frontend/.env
    depends_on:
      - backend
    restart: always
